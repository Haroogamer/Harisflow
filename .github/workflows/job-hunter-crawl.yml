name: Job Hunter Crawl

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 8 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:

jobs:
  monitor-saved-sources:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call crawl endpoint
        run: |
          response=$(curl -L -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.harisflow.com/api/job-hunter/crawl")

          echo "$response"

          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

  discover-internet:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 8 * * *' || github.event.schedule == '17 20 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call internet discovery endpoint
        run: |
          response=$(curl -L -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.harisflow.com/api/job-hunter/discover-internet")

          echo "$response"

          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi