name: Job Hunter

on:
  schedule:
    # GitHub cron is UTC. 12:00/22:00 UTC = 8am/6pm Toronto in summer (EDT),
    # 7am/5pm in winter (EST).
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job hunter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u run.py

      - name: Save updated jobs.db
        run: |
          git config user.name "haroogamer"
          git config user.email "haris.muhammad7865@gmail.com"
          git add -f jobs.db
          if git diff --cached --quiet; then
            echo "no changes to jobs.db"
          else
            git commit -m "jobhunter: update jobs.db"
            git pull --rebase origin main
            git push origin main
          fi
